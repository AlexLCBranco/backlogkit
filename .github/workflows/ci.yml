# Tests on every push and pull request: the lists and version check, unit tests, typecheck + build, and the e2e
# against the built site (GitHub mocked). After a push to main, the same e2e's live parts run against the deployed site
# once Vercel shows this commit's version.
name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request: {}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2 # check-version compares HEAD with its parent
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check-version
        if: github.event_name == 'push'
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test

  live:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.LIVE_URL != ''
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Wait for this version (or a newer one) on the live site
        run: npx tsx scripts/wait-live.ts
        env:
          LIVE_URL: ${{ vars.LIVE_URL }}
      - run: npx playwright test
        env:
          LIVE_URL: ${{ vars.LIVE_URL }}
