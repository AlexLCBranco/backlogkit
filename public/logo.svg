<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="backlogkit">
  <!-- backlogkit: a stack of list rows (planned items), the top one ticked off. Readable at 16 px. -->
  <rect x="1" y="1" width="30" height="30" rx="7" fill="#171a21" stroke="#7aa2ff" stroke-width="2"/>
  <path d="M7.5 10.5l2.2 2.2 4-4.4" fill="none" stroke="#4cc38a" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="16" y="8.5" width="9" height="3.2" rx="1.6" fill="#4cc38a"/>
  <rect x="7" y="14.6" width="18" height="3.2" rx="1.6" fill="#7aa2ff"/>
  <rect x="7" y="20.7" width="12" height="3.2" rx="1.6" fill="#7aa2ff" opacity="0.6"/>
</svg>
